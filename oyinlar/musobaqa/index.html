<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Musobaqa</title>
  <link rel="icon" href="../../bosh/icon.svg">
  <meta name="theme-color" content="#FFF6E5">
  <link rel="stylesheet" href="../umumiy/css/asos.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn" id="btn-home" type="button" aria-label="Barcha oʻyinlar"></button>
      <div class="top-title">Musobaqa</div>
      <div class="top-right">
        <button class="icon-btn" id="btn-pause" type="button" aria-label="Pauza" hidden></button>
        <button class="icon-btn" id="btn-sound" type="button" aria-label="Ovoz"></button>
      </div>
    </header>
    <main class="arena" id="play">
      <section class="side side-left" id="side-left" data-side="left">
        <div class="panel" id="panel-left"></div>
        <div class="fan">
          <div class="fan-bubble" id="bubble-left" hidden></div>
          <div class="actor" id="actor-elder"></div>
          <div class="flag" id="flag-left"></div>
        </div>
      </section>
      <section class="zone-work" id="zone-work" aria-live="polite"></section>
      <section class="zone-control" id="zone-control"></section>
      <section class="side side-right" id="side-right" data-side="right">
        <div class="panel" id="panel-right"></div>
        <div class="fan">
          <div class="fan-bubble" id="bubble-right" hidden></div>
          <div class="actor" id="actor-apprentice"></div>
          <div class="flag" id="flag-right"></div>
        </div>
      </section>
      <div class="overlay" id="overlay" hidden></div>
    </main>
  </div>
  <!-- Savollar uchun o'yinlar mantiqi (sof hisob) -->
  <script src="../umumiy/js/sanoq.js"></script>
  <script src="../05-rim-toshi/js/roman.js"></script>
  <script src="../03-sezar-maktubi/js/caesar.js"></script>
  <script src="../02-qabila-morzesi/js/morse.js"></script>
  <script src="../11-kop-qatlamli-tarmoq/js/neural.js"></script>
  <script src="../12-ai-xaritasi/js/atlas.js"></script>
  <script src="../13-bayt-sandigi/js/bytes.js"></script>
  <script src="../16-xotira-ombori/js/units.js"></script>
  <!-- Umumiy qobiq -->
  <script src="../umumiy/js/sound.js"></script>
  <script src="../umumiy/js/art.js"></script>
  <script src="../umumiy/js/ui.js"></script>
  <!-- Musobaqa -->
  <script src="js/savollar.js"></script>
  <script src="js/musobaqa.js"></script>
  <script src="js/musobaqa-art.js"></script>
  <script src="js/maydon.js"></script>
  <script src="../umumiy/js/offline.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
