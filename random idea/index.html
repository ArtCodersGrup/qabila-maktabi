<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibecoding generatori</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <h1 class="title">Vibecoding generatori</h1>
  <p class="subtitle">Bos, natijada chiqqan topshiriqni AI bilan qil.</p>

  <div class="reels">
    <div class="reel" id="reel-service">
      <span class="reel-label">Xizmat turi</span>
      <span class="reel-word-window"><span class="reel-word" id="reel-service-word">?</span></span>
    </div>
    <div class="reel" id="reel-company">
      <span class="reel-label">Kompaniya</span>
      <span class="reel-word-window"><span class="reel-word" id="reel-company-word">?</span></span>
    </div>
  </div>

  <button id="spin-btn" class="spin-btn" type="button">Aylantir</button>

  <p class="result" id="result" aria-live="polite"></p>
</main>

<script src="js/data.js"></script>
<script src="js/generator.js"></script>
<script src="js/main.js"></script>
</body>
</html>
